name: Kontur CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kontur-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: remote verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm --version

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Handoff safety gate
        timeout-minutes: 1
        run: node tools/handoff-safety-check.mjs

      - name: Direct production deploy refusal regression
        timeout-minutes: 1
        run: node --test tools/cloudflare/refuse-direct-production-deploy.test.mjs

      - name: Runtime reachability regression
        timeout-minutes: 1
        run: node --test tools/runtime-reachability.test.mjs

      - name: Runtime reachability graph
        timeout-minutes: 1
        env:
          RUNTIME_REACHABILITY_OUTPUT: ${{ runner.temp }}/kontur-runtime-reachability.json
          RUNTIME_REACHABILITY_MARKDOWN: ${{ runner.temp }}/kontur-runtime-reachability.md
        run: node tools/runtime-reachability.mjs

      - name: Upload runtime reachability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kontur-runtime-reachability-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kontur-runtime-reachability.json
            ${{ runner.temp }}/kontur-runtime-reachability.md

      - name: Cloudflare staging isolation gate
        timeout-minutes: 1
        run: node tools/cloudflare/staging-config-check.mjs

      - name: Deployment propagation regression test
        timeout-minutes: 1
        run: node --test tools/cloudflare/wait-for-deployed-assets.test.mjs

      - name: Core unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/core test

      - name: DB unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/db test

      - name: Bot unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/bot test

      - name: Mini App unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/miniapp test

      - name: Worker full local test gate
        timeout-minutes: 8
        run: pnpm cf:test

      - name: API integration check
        timeout-minutes: 3
        run: pnpm test:api

      - name: TypeScript typecheck
        timeout-minutes: 5
        run: pnpm typecheck

      - name: Economy simulation
        timeout-minutes: 2
        run: pnpm sim

      - name: D1 transfer check
        timeout-minutes: 3
        run: pnpm cf:test-transfer

      - name: Mini App production build
        timeout-minutes: 5
        run: pnpm build

      - name: Read-only public provenance probe
        timeout-minutes: 2
        env:
          PROVENANCE_OUTPUT: ${{ runner.temp }}/kontur-public-provenance.json
        run: node tools/cloudflare/read-only-public-provenance.mjs

      - name: Upload read-only public provenance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kontur-public-provenance-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/kontur-public-provenance.json

      - name: Reproducible share-safe handoff archive
        timeout-minutes: 4
        shell: pwsh
        run: |
          ./tools/package-handoff.ps1 -ArchiveName KONTUR_CI_HANDOFF
          if (-not (Test-Path ./KONTUR_CI_HANDOFF.zip)) { throw 'handoff zip missing' }
          if (-not (Test-Path ./KONTUR_CI_HANDOFF.zip.sha256)) { throw 'handoff checksum missing' }
          Remove-Item ./KONTUR_CI_HANDOFF.zip, ./KONTUR_CI_HANDOFF.zip.sha256 -Force

      - name: Generate isolated staging config for Wrangler dry-run
        timeout-minutes: 1
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: kontur-igor-staging
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: kontur-staging
          CLOUDFLARE_STAGING_D1_DATABASE_ID: 00000000-0000-4000-8000-000000000001
        run: node tools/cloudflare/make-staging-config.mjs

      - name: Cloudflare staging Wrangler dry-run
        timeout-minutes: 2
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc --dry-run
