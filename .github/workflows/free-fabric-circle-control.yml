name: FREE FABRIC CircleCI Kontur Control

on:
  push:
    branches:
      - ci/kontur-circle-vite-20260821
    paths:
      - .github/workflows/free-fabric-circle-control.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  circle-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Try Circle token A first
        id: run_a
        continue-on-error: true
        env:
          CIRCLE_TOKEN_A: ${{ secrets.CIRCLE_TOKEN_A }}
          CIRCLE_TOKEN_B: ''
        run: |
          set +e
          python3 .free-fabric/circle_control.py
          code=$?
          cp .free-fabric/circle-control-result.json /tmp/circle-a.json 2>/dev/null || true
          exit $code

      - name: Inspect A route
        id: inspect_a
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p='/tmp/circle-a.json'
          d=json.load(open(p)) if os.path.exists(p) else {}
          r=d.get('result') or {}
          started=bool(r.get('pipeline_id'))
          success=r.get('status')=='success'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'started={str(started).lower()}\n')
              f.write(f'success={str(success).lower()}\n')
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY

      - name: Try Circle token B only if A could not start a pipeline
        id: run_b
        if: steps.inspect_a.outputs.started != 'true'
        continue-on-error: true
        env:
          CIRCLE_TOKEN_A: ''
          CIRCLE_TOKEN_B: ${{ secrets.CIRCLE_TOKEN_B }}
        run: |
          set +e
          python3 .free-fabric/circle_control.py
          code=$?
          cp .free-fabric/circle-control-result.json /tmp/circle-b.json 2>/dev/null || true
          exit $code

      - name: Inspect B route
        id: inspect_b
        if: always() && steps.inspect_a.outputs.started != 'true'
        run: |
          python3 - <<'PY'
          import json, os
          p='/tmp/circle-b.json'
          d=json.load(open(p)) if os.path.exists(p) else {}
          r=d.get('result') or {}
          started=bool(r.get('pipeline_id'))
          success=r.get('status')=='success'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'started={str(started).lower()}\n')
              f.write(f'success={str(success).lower()}\n')
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY

      - name: Collect sanitized evidence
        if: always()
        run: |
          mkdir -p /tmp/free-fabric-circle-evidence
          cp /tmp/circle-a.json /tmp/free-fabric-circle-evidence/ 2>/dev/null || true
          cp /tmp/circle-b.json /tmp/free-fabric-circle-evidence/ 2>/dev/null || true
          printf 'control_sha=%s\nbranch=%s\nutc=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/free-fabric-circle-evidence/CONTROL.txt

      - name: Upload sanitized control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-fabric-circle-control-evidence
          path: /tmp/free-fabric-circle-evidence
          if-no-files-found: error

      - name: Final gate
        if: always()
        run: |
          if [ '${{ steps.inspect_a.outputs.started }}' = 'true' ]; then
            test '${{ steps.inspect_a.outputs.success }}' = 'true'
          else
            test '${{ steps.inspect_b.outputs.started }}' = 'true'
            test '${{ steps.inspect_b.outputs.success }}' = 'true'
          fi
