version: 2.1

jobs:
  kontur-browser-diagnostic:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: medium
    environment:
      KONTUR_EXPECTED_SHA: a43af7c736440696fc97d213eca88f1e2e10bb10
      KONTUR_TELEGRAM_EVIDENCE_DIR: /tmp/kontur-telegram-hatch-evidence
    steps:
      - checkout
      - run:
          name: Exact candidate
          command: |
            set -euo pipefail
            git fetch origin fix/kontur-hatch-shells-telegram-viewport-20260822
            git checkout --detach "$KONTUR_EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$KONTUR_EXPECTED_SHA"
            test -z "$(git status --porcelain)"
      - run:
          name: Install and build
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11.22.0 --activate
            pnpm install --frozen-lockfile
            pnpm -F @kontur/miniapp build
      - run:
          name: Chromium diagnostic with HTTP URL logging
          no_output_timeout: 25m
          command: |
            set +e
            mkdir -p /tmp/kontur-circle-diagnostic "$KONTUR_TELEGRAM_EVIDENCE_DIR"
            python3 - <<'PY'
            from pathlib import Path
            p=Path('apps/miniapp/test/telegram-hatch-browser.mjs')
            s=p.read_text()
            needle="  page.on('pageerror', (error) => errors.push(error.message));"
            insert=needle+"\n  page.on('response', (response) => { if (response.status() >= 400) errors.push(`HTTP ${response.status()} ${response.url()}`); });"
            if needle not in s:
                raise SystemExit('diagnostic injection point missing')
            p.write_text(s.replace(needle, insert, 1))
            PY
            pnpm -F @kontur/miniapp exec playwright install --with-deps chromium > /tmp/kontur-circle-diagnostic/playwright-install.log 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              pnpm --dir apps/miniapp exec node test/telegram-hatch-browser.mjs > /tmp/kontur-circle-diagnostic/browser.log 2>&1
              browser_status=$?
            else
              browser_status=99
              echo 'browser skipped because playwright install failed' > /tmp/kontur-circle-diagnostic/browser.log
            fi
            printf 'install_status=%s\nbrowser_status=%s\n' "$install_status" "$browser_status" > /tmp/kontur-circle-diagnostic/status.txt
            cat /tmp/kontur-circle-diagnostic/status.txt
            exit "$browser_status"
      - run:
          name: Publish diagnostic log to GitHub
          when: always
          command: |
            set -euo pipefail
            diag_branch="diagnostics/circle-kontur-browser-20260822"
            git config user.name "Kontur Circle Diagnostic"
            git config user.email "kontur-circle@users.noreply.github.com"
            git restore apps/miniapp/test/telegram-hatch-browser.mjs 2>/dev/null || true
            git switch --create "$diag_branch" "$CIRCLE_SHA1"
            mkdir -p docs/product/evidence/runtime/circle-browser-diagnostic
            cp /tmp/kontur-circle-diagnostic/status.txt docs/product/evidence/runtime/circle-browser-diagnostic/status.txt 2>/dev/null || true
            cp /tmp/kontur-circle-diagnostic/playwright-install.log docs/product/evidence/runtime/circle-browser-diagnostic/playwright-install.log 2>/dev/null || true
            cp /tmp/kontur-circle-diagnostic/browser.log docs/product/evidence/runtime/circle-browser-diagnostic/browser.log 2>/dev/null || true
            cp "$KONTUR_TELEGRAM_EVIDENCE_DIR"/*.png docs/product/evidence/runtime/circle-browser-diagnostic/ 2>/dev/null || true
            git add docs/product/evidence/runtime/circle-browser-diagnostic
            if ! git diff --cached --quiet; then
              git commit -m "evidence: capture Circle browser diagnostic"
              git push --force origin "HEAD:refs/heads/$diag_branch"
            fi

workflows:
  kontur-browser-diagnostic:
    jobs:
      - kontur-browser-diagnostic:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
