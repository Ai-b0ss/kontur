version: 2.1

jobs:
  kontur-final-clean-verify:
    docker:
      - image: cimg/node:22.18
    resource_class: small
    steps:
      - checkout

      - run:
          name: Checkout exact integrated PR12 head without patching
          command: |
            set -euo pipefail
            TARGET_HEAD=5ec223a539f2e3f97eef549fbe8306361281187b
            git fetch origin fix/kontur-core-visual-continuity-20260818
            git checkout --detach "$TARGET_HEAD"
            test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
            test "$(git status --porcelain)" = ""
            echo KONTUR_EXACT_INTEGRATED_HEAD_PASS

      - restore_cache:
          keys:
            - kontur-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - kontur-pnpm-v1-

      - run:
          name: Install exact locked Linux dependencies
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11 --activate
            node --version
            pnpm --version
            pnpm install --frozen-lockfile
            test -d node_modules/.pnpm/@rollup+rollup-linux-x64-gnu@4.62.3
            test -d node_modules/.pnpm/@esbuild+linux-x64@0.25.12
            echo LINUX_NATIVE_DEPS_PASS

      - save_cache:
          key: kontur-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

      - run:
          name: Full Mini App tests
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp test | tee /tmp/kontur-tests.log

      - run:
          name: TypeScript verification
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp typecheck | tee /tmp/kontur-typecheck.log

      - run:
          name: Production Vite build
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp build | tee /tmp/kontur-build.log
            test -f apps/miniapp/dist/index.html
            find apps/miniapp/dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/kontur-dist.sha256
            echo KONTUR_FINAL_CLEAN_VITE_PASS

      - run:
          name: Served production-build smoke
          command: |
            set -euo pipefail
            (pnpm -F @kontur/miniapp exec vite preview --host 127.0.0.1 --port 4173 > /tmp/kontur-preview.log 2>&1 & echo $! > /tmp/kontur-preview.pid)
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4173/ -o /tmp/kontur-index.html; then break; fi
              sleep 1
            done
            test -s /tmp/kontur-index.html
            grep -q '<div id="root"' /tmp/kontur-index.html
            kill "$(cat /tmp/kontur-preview.pid)" 2>/dev/null || true
            echo KONTUR_FINAL_SERVED_BUILD_PASS

      - run:
          name: Write final clean evidence
          when: always
          command: |
            set -euo pipefail
            mkdir -p /tmp/kontur-final-clean-evidence
            {
              echo "integrated_head=5ec223a539f2e3f97eef549fbe8306361281187b"
              echo "circle_sha=$CIRCLE_SHA1"
              echo "circle_branch=$CIRCLE_BRANCH"
              echo "node=$(node --version 2>/dev/null || true)"
              echo "pnpm=$(pnpm --version 2>/dev/null || true)"
              echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > /tmp/kontur-final-clean-evidence/FINAL_CLEAN_EVIDENCE.txt
            cp /tmp/kontur-tests.log /tmp/kontur-final-clean-evidence/ 2>/dev/null || true
            cp /tmp/kontur-typecheck.log /tmp/kontur-final-clean-evidence/ 2>/dev/null || true
            cp /tmp/kontur-build.log /tmp/kontur-final-clean-evidence/ 2>/dev/null || true
            cp /tmp/kontur-dist.sha256 /tmp/kontur-final-clean-evidence/ 2>/dev/null || true
            cp /tmp/kontur-preview.log /tmp/kontur-final-clean-evidence/ 2>/dev/null || true

      - store_artifacts:
          path: apps/miniapp/dist
          destination: kontur-miniapp-dist-final-clean

      - store_artifacts:
          path: /tmp/kontur-final-clean-evidence
          destination: kontur-final-clean-evidence

workflows:
  kontur-final-clean-gate:
    jobs:
      - kontur-final-clean-verify:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
