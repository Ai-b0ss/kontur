version: 2.1

orbs:
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  kontur-final-chromium-proof:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: small
    steps:
      - checkout

      - run:
          name: Checkout exact integrated PR12 head
          command: |
            set -euo pipefail
            TARGET_HEAD=5ec223a539f2e3f97eef549fbe8306361281187b
            git fetch origin fix/kontur-core-visual-continuity-20260818
            git checkout --detach "$TARGET_HEAD"
            test "$(git rev-parse HEAD)" = "$TARGET_HEAD"

      - restore_cache:
          keys:
            - kontur-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - kontur-pnpm-v1-

      - run:
          name: Install exact locked dependencies
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11 --activate
            pnpm install --frozen-lockfile
            test -d node_modules/.pnpm/@rollup+rollup-linux-x64-gnu@4.62.3
            test -d node_modules/.pnpm/@esbuild+linux-x64@0.25.12

      - browser-tools/install-chrome

      - run:
          name: Re-run tests and production build on exact integrated head
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp test | tee /tmp/kontur-tests.log
            pnpm -F @kontur/miniapp typecheck | tee /tmp/kontur-typecheck.log
            pnpm -F @kontur/miniapp build | tee /tmp/kontur-build.log
            test -f apps/miniapp/dist/index.html

      - run:
          name: Render production build in real Chromium at two phone sizes
          command: |
            set -euo pipefail
            mkdir -p /tmp/kontur-browser-proof
            (pnpm -F @kontur/miniapp exec vite preview --host 127.0.0.1 --port 4173 > /tmp/kontur-browser-proof/preview.log 2>&1 & echo $! > /tmp/kontur-browser-proof/preview.pid)
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
              sleep 1
            done
            google-chrome --version | tee /tmp/kontur-browser-proof/chrome-version.txt
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=320,568 --dump-dom http://127.0.0.1:4173/ > /tmp/kontur-browser-proof/dom-320x568.html
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=320,568 --screenshot=/tmp/kontur-browser-proof/render-320x568.png http://127.0.0.1:4173/
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=430,1000 --dump-dom http://127.0.0.1:4173/ > /tmp/kontur-browser-proof/dom-430x1000.html
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=430,1000 --screenshot=/tmp/kontur-browser-proof/render-430x1000.png http://127.0.0.1:4173/
            python3 - <<'PY'
            from pathlib import Path
            for name in ('dom-320x568.html','dom-430x1000.html'):
                text=(Path('/tmp/kontur-browser-proof')/name).read_text(errors='replace')
                if 'id="root"' not in text:
                    raise SystemExit(f'{name}: missing root')
                compact=''.join(text.split())
                if '<divid="root"></div>' in compact:
                    raise SystemExit(f'{name}: React root stayed empty')
            print('KONTUR_REAL_CHROMIUM_RENDER_PASS')
            PY
            kill "$(cat /tmp/kontur-browser-proof/preview.pid)" 2>/dev/null || true

      - run:
          name: Write final DONE evidence
          when: always
          command: |
            set -euo pipefail
            mkdir -p /tmp/kontur-browser-proof
            {
              echo "integrated_head=5ec223a539f2e3f97eef549fbe8306361281187b"
              echo "source_head=32034e8af92923a2abe09ad00e3220f6da1ed21c"
              echo "circle_sha=$CIRCLE_SHA1"
              echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > /tmp/kontur-browser-proof/DONE_EVIDENCE.txt

      - store_artifacts:
          path: /tmp/kontur-browser-proof
          destination: kontur-final-browser-proof

workflows:
  kontur-final-browser-gate:
    jobs:
      - kontur-final-chromium-proof:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
