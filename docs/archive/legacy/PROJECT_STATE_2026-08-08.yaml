    - "eight equal entry paths: ask, help, connect, orient, opportunity, contribution, save and progress"
    - "reply-only /worm, separate reputation and spendable wallet"
    - "passive reward, eggs, colorings and collection retained as the foundation"
    - "opt-in flock requests, opportunity routes and a personal nest"
    - "operator-confirmed signal cards and golden feathers"
    - "V4 zero season MVP core surface: pretest to bird, /worm teaching, classic wallet/reputation when hatched, season eggs, one daily series CTA, branch, forecasts and optional flights"
    - "V5 live campaign retained as shelf layer: pretest, Form I/II birds, five-card move, shared tree, forecasts and raid code remain; not the public menu surface"
  explicitly_not_current:
    - "automatic Telegram posting or background message sending"
    - "user-uploaded proof workflow"
    - "web admin panel"
    - "automatic Telegram posting or manual content factory for V4"
    - "automatic public V5 posting; the V5 publication gate is intentionally disabled"
  current_product_decision:
    status: "MVP core redesigned on V4 ?season=zero; V5 retained as shelf layer with game gate on and publication off"
    file: "docs/mvp-core-2026-08-08/MVP_CORE.md"
    rejected: "the lost-applicant navigator hypothesis and treating unfinished V5 UI as the public product"
    chosen_direction:
      name: "core on V4 home; crown A+B retained for V5 shelf"
      file: "docs/direction-candidates-2026-08-07/CHOSEN_DIRECTION_AB.md"
      first_session_flow: "docs/direction-candidates-2026-08-07/FIRST_SESSION_FLOW.md"
      basis: "Igor core (worm respect, eggs, colors) plus one daily branch move on the existing V4 URL"
      solo_rule: "solo daily series remains complete without other players"
      group_rule: "reply-only /worm in the live chat; forecasts and flights entice but do not replace the primary CTA"
      education_rule: "education lives inside the short series; CU remains a later optional bridge"
    desired_core: "a compact live-chat product: bird identity, /worm respect economy, eggs/colors, and one clear daily move"
    long_term_constraint: "must survive for months inside one roughly 250-person chat without CU content, operations or attention"
    visual_hold: "Variant B graphite+cyan accepted for ZeroSeason (VISUAL_DIRECTION_CU.md); V5 crown UI remains shelf; publication gate stays disabled"
    visual_direction:
      status: "accepted Variant B"
      file: "docs/mvp-core-2026-08-08/VISUAL_DIRECTION_CU.md"
      tokens: "bg #141414, accent #5AC8D5, egg #8068F4, worm #D5F15A; Manrope+Inter"

    direction_candidates:
      status: "owner selected A+B hybrid as V5 shelf direction; public MVP is V4 core surface"
      file: "docs/direction-candidates-2026-08-07/README.md"
      options:
        - "A crown under storm"
        - "B flock rally"
        - "C branch tabletop"
    implementation_boundary: "MVP core UI and optional V4 state.core enrichment allowed; no D1 reset, no V3 allowlist expansion, no V5 publication-gate change without a separate decision"

