name: Kontur release staging proof

on:
  push:
    branches:
      - release/kontur-2026-08-17
    paths:
      - .release-trigger/staging.txt

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 7a5b709a066fca0ee563c42b3e5c4f10
  STAGING_WORKER_NAME: kontur-igor-staging
  STAGING_D1_NAME: kontur-staging
  STAGING_D1_ID: 22786b4b-99cc-4ca5-a18b-932e8781021b
  STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev
  STAGING_TG_ID: '987654321'
  PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985

jobs:
  release-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Install and verify exact handoff source
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Generate isolated inert staging Wrangler config
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: ${{ env.STAGING_WORKER_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ env.STAGING_D1_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ env.STAGING_D1_ID }}
          CLOUDFLARE_STAGING_ORIGIN: ${{ env.STAGING_ORIGIN }}
        run: |
          node tools/cloudflare/make-staging-config.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('apps/worker/wrangler.staging.generated.jsonc','utf8'));
          const v=c.vars||{};
          const required={BOT_TOKEN:'staging-disabled-not-a-telegram-token',MAIN_CHAT_ID:'-1000000000000',MINIAPP_URL:process.env.STAGING_ORIGIN,DEV_MODE:'false',ZERO_SEASON_ENABLED:'true',LIVE_CAMPAIGN_V5_ENABLED:'false',LIVE_CAMPAIGN_V5_PUBLISH_ENABLED:'false',V5_LLM_PROVIDER:'disabled'};
          for(const [k,value] of Object.entries(required)) if(v[k]!==value) throw new Error(`unsafe staging var ${k}`);
          console.log('STAGING_INERT_RUNTIME_CONFIG_PASS');
          NODE

      - name: Verify staging identity and production separation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_D1_ID" != "$PROD_D1_ID"
          pnpm -F @kontur/worker exec wrangler d1 info "$STAGING_D1_NAME" --json > "$RUNNER_TEMP/staging-d1.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync(process.env.RUNNER_TEMP+'/staging-d1.json','utf8');
          if(!text.includes(process.env.STAGING_D1_NAME)||!text.includes(process.env.STAGING_D1_ID)) throw new Error('staging D1 identity mismatch');
          if(text.includes(process.env.PROD_D1_ID)) throw new Error('production D1 leaked into staging identity');
          console.log('STAGING_IDENTITY_PASS');
          NODE

      - name: Reset staging D1 to a truly fresh schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm -F @kontur/worker exec wrangler d1 execute "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name" > "$RUNNER_TEMP/tables.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/tables.json','utf8'));
          const names=[];
          const walk=(v)=>{ if(Array.isArray(v)) v.forEach(walk); else if(v&&typeof v==='object'){ if(typeof v.name==='string') names.push(v.name); Object.values(v).forEach(walk); } };
          walk(data);
          const uniq=[...new Set(names)].filter(n=>!n.startsWith('sqlite_')&&!n.startsWith('_cf_'));
          if(!uniq.includes('users') && !uniq.includes('d1_migrations')) throw new Error('unexpected staging schema; refusing reset');
          const q=(s)=>'"'+s.replaceAll('"','""')+'"';
          const sql=['PRAGMA foreign_keys=OFF;',...uniq.map(n=>`DROP TABLE IF EXISTS ${q(n)};`),'PRAGMA foreign_keys=ON;'].join('\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/reset.sql',sql);
          console.log(`STAGING_RESET_PLAN_PASS tables=${uniq.length}`);
          NODE
          pnpm -F @kontur/worker exec wrangler d1 execute "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc --file "$RUNNER_TEMP/reset.sql"
          pnpm -F @kontur/worker exec wrangler d1 migrations apply "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc

      - name: Deploy latest handoff source to isolated staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -F @kontur/worker exec wrangler deploy --keep-vars --config wrangler.staging.generated.jsonc

      - name: Wait for exact staging frontend generation and approved eggs
        env:
          RELEASE_ORIGIN: ${{ env.STAGING_ORIGIN }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}
          RELEASE_EVIDENCE_PREFIX: staging
          RELEASE_PROPAGATION_TIMEOUT_MS: '180000'
        run: node tools/cloudflare/wait-for-deployed-assets.mjs

      - name: Remote staging health after exact frontend convergence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$STAGING_ORIGIN/api/v1/health?kontur_release_probe=${GITHUB_SHA}" -o "$RUNNER_TEMP/health.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health.json','utf8'));
          if(x.ok!==true||x.devMode!==false||x.driver!=='d1'||x.hatched!==0) throw new Error('fresh staging health mismatch');
          console.log('STAGING_HEALTH_PASS');
          NODE
          echo STAGING_REMOTE_ASSET_SMOKE_PASS

      - name: Seed isolated synthetic player with exactly five worms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm -F @kontur/worker exec wrangler d1 execute "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc --command "DELETE FROM rate_limits WHERE user_id IN (SELECT id FROM users WHERE tg_id=$STAGING_TG_ID); DELETE FROM events WHERE user_id IN (SELECT id FROM users WHERE tg_id=$STAGING_TG_ID); DELETE FROM users WHERE tg_id=$STAGING_TG_ID; INSERT INTO users (tg_id,username,started_bot_at,is_member,member_checked_at) VALUES ($STAGING_TG_ID,'release_staging_987654321',datetime('now'),1,datetime('now')); UPDATE wallets SET wallet=5 WHERE user_id=(SELECT id FROM users WHERE tg_id=$STAGING_TG_ID);"

      - name: Prove current MVP remotely end to end
        run: node tools/cloudflare/live-release-staging-smoke.mjs

      - name: Cleanup synthetic staging player
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/worker/wrangler.staging.generated.jsonc ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            pnpm -F @kontur/worker exec wrangler d1 execute "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc --command "DELETE FROM rate_limits WHERE user_id IN (SELECT id FROM users WHERE tg_id=$STAGING_TG_ID); DELETE FROM events WHERE user_id IN (SELECT id FROM users WHERE tg_id=$STAGING_TG_ID); DELETE FROM users WHERE tg_id=$STAGING_TG_ID);"
            echo STAGING_SYNTHETIC_CLEANUP_PASS
          fi
