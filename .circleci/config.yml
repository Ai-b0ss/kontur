version: 2.1

jobs:
  kontur-core-browser-acceptance:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: medium
    environment:
      KONTUR_EXPECTED_SHA: 2d84a05f626da76ba1e1b65fa88ea383a8dec760
      KONTUR_BROWSER_EVIDENCE_DIR: /tmp/kontur-core-evidence/browser
      KONTUR_STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev
    steps:
      - checkout

      - run:
          name: Checkout exact clean PR12 head without overlay
          command: |
            set -euo pipefail
            git fetch origin fix/kontur-core-visual-continuity-20260818
            git checkout --detach "$KONTUR_EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$KONTUR_EXPECTED_SHA"
            test -z "$(git status --porcelain)"
            git diff --exit-code
            printf 'repo=Ai-b0ss/kontur\nbranch=fix/kontur-core-visual-continuity-20260818\nhead=%s\nclean=true\npatch_overlay=false\n' "$KONTUR_EXPECTED_SHA" | tee /tmp/kontur-source.txt
            echo KONTUR_EXACT_CLEAN_HEAD_PASS

      - restore_cache:
          keys:
            - kontur-core-browser-v2-{{ checksum "pnpm-lock.yaml" }}
            - kontur-core-browser-v2-

      - run:
          name: Frozen Linux install and native binaries
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11.22.0 --activate
            node --version | tee /tmp/node-version.txt
            pnpm --version | tee /tmp/pnpm-version.txt
            pnpm install --frozen-lockfile | tee /tmp/install.log
            test -d node_modules/.pnpm/@rollup+rollup-linux-x64-gnu@4.62.3
            test -d node_modules/.pnpm/@esbuild+linux-x64@0.25.12
            echo LINUX_NATIVE_DEPS_PASS

      - save_cache:
          key: kontur-core-browser-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

      - run:
          name: Product regressions
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp test | tee /tmp/miniapp-tests.log
            pnpm -F @kontur/core test | tee /tmp/core-tests.log
            pnpm -F @kontur/db test | tee /tmp/db-tests.log
            pnpm -F @kontur/bot test | tee /tmp/bot-tests.log
            pnpm -F @kontur/worker test | tee /tmp/worker-tests.log

      - run:
          name: TypeScript contracts
          command: |
            set -euo pipefail
            pnpm -r --if-present typecheck | tee /tmp/typecheck.log

      - run:
          name: Canonical production build and served-dist smoke
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp build | tee /tmp/vite-build.log
            test -f apps/miniapp/dist/index.html
            find apps/miniapp/dist -type f -print0 | sort -z | xargs -0 sha256sum | tee /tmp/dist.sha256
            js_bytes="$(find apps/miniapp/dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
            dist_bytes="$(du -sb apps/miniapp/dist | awk '{print $1}')"
            test "$js_bytes" -le 512000
            test "$dist_bytes" -le 5242880
            printf 'js_bytes=%s\ndist_bytes=%s\njs_budget=512000\ndist_budget=5242880\n' "$js_bytes" "$dist_bytes" | tee /tmp/dist-budget.txt
            (cd apps/miniapp/dist && python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dist-http.log 2>&1) &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html -o /tmp/dist-index.html && break; sleep 1; done
            test -s /tmp/dist-index.html
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            trap - EXIT
            echo PRODUCTION_DIST_HTTP_PASS

      - run:
          name: Real Chromium behavior, viewport, motion and continuity proof
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp exec playwright install --with-deps chromium
            pnpm -F @kontur/miniapp test:browser:kontur | tee /tmp/browser-acceptance.log
            test -s "$KONTUR_BROWSER_EVIDENCE_DIR/browser-acceptance.json"
            node -e 'const f=require(process.env.KONTUR_BROWSER_EVIDENCE_DIR+"/browser-acceptance.json"); if(f.result!=="PASS"||f.exactHead!==process.env.KONTUR_EXPECTED_SHA||f.consoleErrors.length) process.exit(1)'
            for f in 01-hook.png 02-hook-start-before.png 03-quiz-q1.png 04-quiz-q4.png 05-quiz-q8.png 06-bird-reveal.png 07-worm-loop.png 08-home.png 09-new-coloring-drop.png 10-reload-persistence.png 11-replay-same-bird.png 12-large-hook.png 13-large-home.png 14-reduced-motion-reveal.png motion-1-hook-to-q1.webm motion-2-q1-q4-q8-cracks.webm motion-3-q8-to-reveal.webm; do test -s "$KONTUR_BROWSER_EVIDENCE_DIR/$f"; done
            echo REAL_CHROMIUM_ARTIFACT_GATE_PASS

      - run:
          name: Exact-generation staging and synthetic economy persistence
          command: |
            set -euo pipefail
            RELEASE_ORIGIN="$KONTUR_STAGING_ORIGIN" RELEASE_PROPAGATION_TIMEOUT_MS=180000 node tools/cloudflare/wait-for-deployed-assets.mjs | tee /tmp/staging-assets.log
            code="$(curl -sS -o /tmp/staging-unauth.json -w '%{http_code}' "$KONTUR_STAGING_ORIGIN/api/v4/local/state")"
            test "$code" = 401
            STAGING_ORIGIN="$KONTUR_STAGING_ORIGIN" STAGING_TG_ID="$((820000000 + CIRCLE_BUILD_NUM))" node tools/cloudflare/live-release-staging-smoke.mjs 2>&1 | tee /tmp/staging-live-smoke.log
            echo STAGING_EXACT_GENERATION_AND_LIVE_SYNTHETIC_PASS

      - run:
          name: Collect evidence
          when: always
          command: |
            set -euo pipefail
            mkdir -p /tmp/kontur-core-evidence/logs
            cp /tmp/kontur-source.txt /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/node-version.txt /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/pnpm-version.txt /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/install.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/miniapp-tests.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/core-tests.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/db-tests.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/bot-tests.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/worker-tests.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/typecheck.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/vite-build.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/dist.sha256 /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/dist-budget.txt /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/browser-acceptance.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/staging-assets.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            cp /tmp/staging-live-smoke.log /tmp/kontur-core-evidence/logs/ 2>/dev/null || true
            {
              echo "kontur_head=$KONTUR_EXPECTED_SHA"
              echo "circle_trigger=$CIRCLE_SHA1"
              echo "circle_branch=$CIRCLE_BRANCH"
              echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "clean=true"
              echo "patch_overlay=false"
              echo "production_touched=false"
              echo "staging_synthetic_test_data=true"
            } > /tmp/kontur-core-evidence/CIRCLE_EVIDENCE.txt

      - run:
          name: Publish sanitized immutable evidence branch
          when: always
          command: |
            set -euo pipefail
            evidence_branch="evidence/kontur-core-2d84a05f-drop-diagnostic-20260822"
            target="docs/product/evidence/runtime/2d84a05f-drop-diagnostic"
            git switch --create "$evidence_branch" "$KONTUR_EXPECTED_SHA"
            mkdir -p "$target/browser" "$target/logs"
            cp "$KONTUR_BROWSER_EVIDENCE_DIR"/*.png "$target/browser/" 2>/dev/null || true
            cp "$KONTUR_BROWSER_EVIDENCE_DIR"/*.webm "$target/browser/" 2>/dev/null || true
            cp "$KONTUR_BROWSER_EVIDENCE_DIR"/browser-acceptance.json "$target/browser/" 2>/dev/null || true
            cp /tmp/kontur-core-evidence/logs/* "$target/logs/" 2>/dev/null || true
            cp /tmp/kontur-core-evidence/CIRCLE_EVIDENCE.txt "$target/"
            find "$target" -type f -print0 | sort -z | xargs -0 sha256sum > "$target/SHA256SUMS.txt"
            git config user.name "Kontur Acceptance Bot"
            git config user.email "kontur-acceptance@users.noreply.github.com"
            git add "$target"
            git commit -m "evidence: preserve 2d84a05f drop diagnostic evidence"
            git push origin "HEAD:refs/heads/$evidence_branch"
            echo "EVIDENCE_BRANCH_PASS branch=$evidence_branch"

      - store_artifacts:
          path: /tmp/kontur-core-evidence
          destination: kontur-core-browser-acceptance

workflows:
  kontur-core-browser-acceptance:
    jobs:
      - kontur-core-browser-acceptance:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
