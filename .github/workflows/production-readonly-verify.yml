name: Kontur production read-only asset proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-readonly-verify.yml

permissions:
  contents: read

jobs:
  verify:
    name: exact deployed frontend bytes
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frozen Mini App
        run: pnpm build

      - name: Verify current production without writes
        env:
          RELEASE_ORIGIN: https://kontur-igor.igorekglukhovskii43.workers.dev
          RELEASE_PROPAGATION_TIMEOUT_MS: '60000'
          RELEASE_PROPAGATION_INTERVAL_MS: '3000'
          RELEASE_EVIDENCE_DIR: production-readonly-evidence
          RELEASE_EVIDENCE_PREFIX: production
        run: node tools/cloudflare/wait-for-deployed-assets.mjs

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kontur-production-readonly-${{ github.run_id }}
          path: production-readonly-evidence/
          if-no-files-found: ignore
          retention-days: 7
