name: TEMP disable Free Fabric cron

on:
  push:
    branches:
      - ops/disable-free-fabric-cron-20260926
    paths:
      - .github/workflows/temp-disable-free-fabric-cron.yml

permissions:
  contents: read

concurrency:
  group: temp-disable-free-fabric-cron
  cancel-in-progress: false

jobs:
  disable-cron:
    runs-on: [self-hosted, Windows, X64, ff-win]
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SCRIPT_NAME: free-fabric-control-staging

    steps:
      - name: Disable Free Fabric staging cron and verify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:CF_ACCOUNT_ID){ throw 'Missing CLOUDFLARE_ACCOUNT_ID' }
          if(-not $env:CF_API_TOKEN){ throw 'Missing CLOUDFLARE_API_TOKEN' }
          $u="https://api.cloudflare.com/client/v4/accounts/$env:CF_ACCOUNT_ID/workers/scripts/$env:CF_SCRIPT_NAME/schedules"
          $h=@{Authorization="Bearer $env:CF_API_TOKEN"}
          $before=Invoke-RestMethod -Method Get -Uri $u -Headers $h
          if(-not $before.success){ throw 'Cloudflare GET schedules failed' }
          Write-Host ('BEFORE_CRONS=' + (($before.result | ForEach-Object cron) -join ','))
          $updated=Invoke-RestMethod -Method Put -Uri $u -Headers $h -ContentType 'application/json' -Body '[]'
          if(-not $updated.success){ throw 'Cloudflare PUT schedules failed' }
          $after=Invoke-RestMethod -Method Get -Uri $u -Headers $h
          if(-not $after.success){ throw 'Cloudflare verification GET failed' }
          if(@($after.result).Count -ne 0){ throw 'Cron trigger removal did not persist' }
          Write-Host 'FREE_FABRIC_CRON_DISABLED'
