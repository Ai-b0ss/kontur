name: Kontur Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight = no Cloudflare writes; deploy = staging Worker only; deploy-with-migrations = staging D1 migrations then staging Worker'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
          - deploy-with-migrations

permissions:
  contents: read

concurrency:
  group: kontur-cloudflare-staging
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 7a5b709a066fca0ee563c42b3e5c4f10
  STAGING_WORKER_NAME: kontur-igor-staging
  STAGING_D1_NAME: kontur-staging
  CLOUDFLARE_STAGING_D1_DATABASE_ID: 22786b4b-99cc-4ca5-a18b-932e8781021b
  STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev
  STAGING_BOT_TOKEN: staging-disabled-not-a-telegram-token
  STAGING_TG_ID: '987654321'
  PROD_WORKER_NAME: kontur-igor
  PROD_D1_NAME: kontur
  PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985

jobs:
  staging:
    name: staging safety + optional deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Offline staging isolation gate
        run: |
          node tools/cloudflare/staging-config-check.mjs
          node --check tools/cloudflare/live-staging-api-smoke.mjs

      - name: Full project verification before any remote write
        run: pnpm check
        timeout-minutes: 15

      - name: Build Mini App assets
        run: pnpm build
        timeout-minutes: 5

      - name: Generate synthetic staging config for preflight
        if: inputs.mode == 'preflight'
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: ${{ env.STAGING_WORKER_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ env.STAGING_D1_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_ID: 00000000-0000-4000-8000-000000000001
        run: node tools/cloudflare/make-staging-config.mjs

      - name: Validate Wrangler bundle without Cloudflare access
        if: inputs.mode == 'preflight'
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc --dry-run

      - name: Require Cloudflare token for remote modes
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test "$STAGING_WORKER_NAME" != "$PROD_WORKER_NAME"
          test "$STAGING_D1_NAME" != "$PROD_D1_NAME"
          test "$CLOUDFLARE_STAGING_D1_DATABASE_ID" != "$PROD_D1_ID"
          case "$STAGING_ORIGIN" in
            https://kontur-igor-staging.*) ;;
            *) echo 'Refusing non-staging origin'; exit 1 ;;
          esac
          echo 'CLOUDFLARE_STAGING_REMOTE_INPUTS_PASS'

      - name: Verify token and exact staging D1 identity read-only
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify > "$RUNNER_TEMP/token.json"
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/token.json','utf8')); if(!x.success||x.result?.status!=='active') throw new Error('Cloudflare token is not active'); console.log('CLOUDFLARE_TOKEN_VERIFY_PASS')"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$CLOUDFLARE_STAGING_D1_DATABASE_ID" > "$RUNNER_TEMP/staging-d1.json"
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/staging-d1.json','utf8')); if(!x.success) throw new Error('Staging D1 is not readable'); if(x.result?.uuid!==process.env.CLOUDFLARE_STAGING_D1_DATABASE_ID) throw new Error('Staging D1 UUID mismatch'); if(x.result?.name!==process.env.STAGING_D1_NAME) throw new Error('Staging D1 name mismatch'); if(x.result?.uuid===process.env.PROD_D1_ID) throw new Error('Resolved production D1'); console.log('STAGING_D1_IDENTITY_PASS')"

      - name: Snapshot forbidden production targets read-only
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_ID" > "$RUNNER_TEMP/prod-d1-before.json"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_WORKER_NAME/deployments" > "$RUNNER_TEMP/prod-worker-before.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          const d1 = JSON.parse(fs.readFileSync(`${root}/prod-d1-before.json`, 'utf8'));
          const worker = JSON.parse(fs.readFileSync(`${root}/prod-worker-before.json`, 'utf8'));
          if (!d1.success || d1.result?.uuid !== process.env.PROD_D1_ID || d1.result?.name !== process.env.PROD_D1_NAME) throw new Error('Production D1 identity mismatch before staging write');
          if (!worker.success || !Array.isArray(worker.result?.deployments) || worker.result.deployments.length < 1) throw new Error('Production Worker deployment identity unavailable before staging write');
          const snapshot = {
            d1Uuid: d1.result.uuid,
            d1Name: d1.result.name,
            workerDeployments: worker.result.deployments.map((d) => ({ id: d.id, versions: d.versions, source: d.source, strategy: d.strategy })),
          };
          fs.writeFileSync(`${root}/prod-identity-before.json`, JSON.stringify(snapshot));
          console.log('PRODUCTION_IDENTITY_SNAPSHOT_PASS');
          NODE

      - name: Generate remote staging config
        if: inputs.mode != 'preflight'
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: ${{ env.STAGING_WORKER_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ env.STAGING_D1_NAME }}
        run: node tools/cloudflare/make-staging-config.mjs

      - name: Fail closed on generated remote target
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('apps/worker/wrangler.staging.generated.jsonc','utf8')); const d=c.d1_databases.find(x=>x.binding==='DB'); if(c.name!==process.env.STAGING_WORKER_NAME||c.name===process.env.PROD_WORKER_NAME) throw new Error('unsafe Worker target'); if(!d||d.database_id!==process.env.CLOUDFLARE_STAGING_D1_DATABASE_ID||d.database_id===process.env.PROD_D1_ID) throw new Error('unsafe D1 target'); if('triggers' in c||'routes' in c||'route' in c) throw new Error('remote routes/triggers leaked'); if(c.vars?.DEV_MODE!=='false'||c.vars?.LIVE_CAMPAIGN_V5_ENABLED!=='false'||c.vars?.LIVE_CAMPAIGN_V5_PUBLISH_ENABLED!=='false'||c.vars?.V5_LLM_PROVIDER!=='disabled') throw new Error('unsafe runtime gate'); console.log('REMOTE_STAGING_FAIL_CLOSED_PASS')"

      - name: Remote staging Wrangler dry-run
        if: inputs.mode != 'preflight'
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc --dry-run

      - name: Apply migrations to staging D1 only
        if: inputs.mode == 'deploy-with-migrations'
        run: pnpm -F @kontur/worker exec wrangler d1 migrations apply "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc
        timeout-minutes: 5

      - name: Deploy staging Worker only
        if: inputs.mode != 'preflight'
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc
        timeout-minutes: 8

      - name: Live smoke on isolated staging
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          root_code=$(curl -sS -o "$RUNNER_TEMP/root.html" -w '%{http_code}' "$STAGING_ORIGIN/")
          test "$root_code" = 200 || { echo "Staging root failed: HTTP $root_code"; exit 1; }
          grep -q '<div id="root">' "$RUNNER_TEMP/root.html" || { echo 'Mini App root marker missing'; exit 1; }

          health_code=$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$STAGING_ORIGIN/api/v1/health")
          test "$health_code" = 200 || { echo "Staging health failed: HTTP $health_code"; cat "$RUNNER_TEMP/health.json"; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health.json','utf8')); if(x.ok!==true||x.devMode!==false||x.driver!=='d1') throw new Error('bad staging health'); console.log(JSON.stringify({ok:x.ok,devMode:x.devMode,driver:x.driver,startedBot:x.startedBot,hatched:x.hatched,grants:x.grants}));"
          echo 'STAGING_LIVE_SMOKE_PASS'

      - name: Seed one synthetic staging-only product user
        if: inputs.mode != 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          pnpm -F @kontur/worker exec wrangler d1 execute "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc --command "DELETE FROM events WHERE user_id IN (SELECT id FROM users WHERE tg_id = $STAGING_TG_ID); DELETE FROM users WHERE tg_id = $STAGING_TG_ID;"
          pnpm -F @kontur/worker exec wrangler d1 execute "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc --command "INSERT INTO users (tg_id, username, started_bot_at, is_member, member_checked_at) VALUES ($STAGING_TG_ID, 'staging_smoke_987654321', datetime('now'), 1, datetime('now'));"

      - name: Real remote auth to questions to hatch to state
        if: inputs.mode != 'preflight'
        run: node tools/cloudflare/live-staging-api-smoke.mjs

      - name: Cleanup synthetic staging product user
        if: ${{ always() && inputs.mode != 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/worker/wrangler.staging.generated.jsonc ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            pnpm -F @kontur/worker exec wrangler d1 execute "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc --command "DELETE FROM events WHERE user_id IN (SELECT id FROM users WHERE tg_id = $STAGING_TG_ID); DELETE FROM users WHERE tg_id = $STAGING_TG_ID;"
            echo 'STAGING_SYNTHETIC_USER_CLEANUP_PASS'
          fi

      - name: Verify forbidden production targets stayed unchanged
        if: ${{ always() && inputs.mode != 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/prod-identity-before.json" ]; then
            echo 'Production identity snapshot was not created; no post-write comparison is possible.' >&2
            exit 1
          fi
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_ID" > "$RUNNER_TEMP/prod-d1-after.json"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_WORKER_NAME/deployments" > "$RUNNER_TEMP/prod-worker-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          const before = JSON.parse(fs.readFileSync(`${root}/prod-identity-before.json`, 'utf8'));
          const d1 = JSON.parse(fs.readFileSync(`${root}/prod-d1-after.json`, 'utf8'));
          const worker = JSON.parse(fs.readFileSync(`${root}/prod-worker-after.json`, 'utf8'));
          if (!d1.success || d1.result?.uuid !== process.env.PROD_D1_ID || d1.result?.name !== process.env.PROD_D1_NAME) throw new Error('Production D1 identity changed after staging write');
          if (!worker.success || !Array.isArray(worker.result?.deployments) || worker.result.deployments.length < 1) throw new Error('Production Worker deployment identity unavailable after staging write');
          const after = {
            d1Uuid: d1.result.uuid,
            d1Name: d1.result.name,
            workerDeployments: worker.result.deployments.map((d) => ({ id: d.id, versions: d.versions, source: d.source, strategy: d.strategy })),
          };
          if (JSON.stringify(after) !== JSON.stringify(before)) throw new Error('Forbidden production target changed during staging workflow');
          console.log('PRODUCTION_UNCHANGED_AFTER_STAGING_PASS');
          NODE

      - name: Cleanup transient evidence
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/token.json" "$RUNNER_TEMP/staging-d1.json" "$RUNNER_TEMP/root.html" "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/prod-d1-before.json" "$RUNNER_TEMP/prod-worker-before.json" "$RUNNER_TEMP/prod-identity-before.json" "$RUNNER_TEMP/prod-d1-after.json" "$RUNNER_TEMP/prod-worker-after.json"
