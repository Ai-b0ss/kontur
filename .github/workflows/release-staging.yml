name: Kontur release staging proof

on:
  push:
    branches:
      - fix/kontur-core-visual-continuity-20260818
    paths:
      - .release-trigger/nondestructive-staging.txt

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_ACCOUNT_ID: 7a5b709a066fca0ee563c42b3e5c4f10
  STAGING_WORKER_NAME: kontur-igor-staging
  STAGING_D1_NAME: kontur-staging
  STAGING_D1_ID: 22786b4b-99cc-4ca5-a18b-932e8781021b
  STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev
  PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985

jobs:
  release-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Install and verify exact source
        run: |
          pnpm install --frozen-lockfile
          node tools/handoff-safety-check.mjs
          pnpm -F @kontur/miniapp test
          pnpm -F @kontur/miniapp build
      - name: Generate and assert isolated inert staging config
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: ${{ env.STAGING_WORKER_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ env.STAGING_D1_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ env.STAGING_D1_ID }}
          CLOUDFLARE_STAGING_ORIGIN: ${{ env.STAGING_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/cloudflare/make-staging-config.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('apps/worker/wrangler.staging.generated.jsonc','utf8'));
          const required={ZERO_SEASON_ENABLED:'true',LIVE_CAMPAIGN_V5_ENABLED:'false',LIVE_CAMPAIGN_V5_PUBLISH_ENABLED:'false',BOT_TOKEN:'staging-disabled-not-a-telegram-token'};
          for(const [k,v] of Object.entries(required)) if(c.vars?.[k]!==v) throw new Error(`unsafe staging config ${k}`);
          console.log('STAGING_RUNTIME_GATES_PASS');
          NODE
      - name: Verify staging identity without mutating D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_D1_ID" != "$PROD_D1_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm -F @kontur/worker exec wrangler d1 info "$STAGING_D1_NAME" --json > "$RUNNER_TEMP/staging-d1.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync(process.env.RUNNER_TEMP+'/staging-d1.json','utf8');
          if(!text.includes(process.env.STAGING_D1_NAME)||!text.includes(process.env.STAGING_D1_ID)) throw new Error('staging D1 identity mismatch');
          if(text.includes(process.env.PROD_D1_ID)) throw new Error('production D1 leaked into staging identity');
          console.log('STAGING_IDENTITY_READONLY_PASS');
          NODE
      - name: Deploy exact source to isolated staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -F @kontur/worker exec wrangler deploy --keep-vars --config wrangler.staging.generated.jsonc
      - name: Wait for exact staging frontend generation
        env:
          RELEASE_ORIGIN: ${{ env.STAGING_ORIGIN }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}
          RELEASE_EVIDENCE_PREFIX: staging-nondestructive
          RELEASE_PROPAGATION_TIMEOUT_MS: '180000'
        run: node tools/cloudflare/wait-for-deployed-assets.mjs
      - name: Verify canonical assets and API auth boundary remotely
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$STAGING_ORIGIN/results/kotosov.webp?sha=$GITHUB_SHA" -o "$RUNNER_TEMP/kotosov.webp"
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$STAGING_ORIGIN/results/crane-collectible.svg?sha=$GITHUB_SHA" -o "$RUNNER_TEMP/crane.svg"
          test "$(sha256sum apps/miniapp/public/results/kotosov.webp | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/kotosov.webp" | awk '{print $1}')"
          test "$(sha256sum apps/miniapp/public/results/crane-collectible.svg | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/crane.svg" | awk '{print $1}')"
          grep -q '<svg' "$RUNNER_TEMP/crane.svg"
          code="$(curl -sS -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' "$STAGING_ORIGIN/api/local/state?sha=$GITHUB_SHA")"
          test "$code" = "401"
          echo "KONTUR_STAGING_NONDESTRUCTIVE_PASS head=$GITHUB_SHA origin=$STAGING_ORIGIN staging_d1=$STAGING_D1_ID production_d1_untouched=$PROD_D1_ID"
      - name: Report staging proof to KONTUR control
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 9 --repo "$GITHUB_REPOSITORY" --body "STAGING_PROOF generation=v3 lane=KONTUR head=$GITHUB_SHA run=$GITHUB_RUN_ID status=$JOB_STATUS mode=NONDESTRUCTIVE staging_worker=$STAGING_WORKER_NAME staging_d1=$STAGING_D1_ID production_d1=$PROD_D1_ID production_write=0 d1_write=0"
