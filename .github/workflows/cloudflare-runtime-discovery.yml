name: Kontur Cloudflare runtime discovery

on:
  push:
    branches:
      - infra/cloudflare-runtime-discovery

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify encrypted runtime object
        shell: bash
        run: |
          set -euo pipefail
          test -f .runtime-state/kontur-runtime-state.tar.gz.gpg
          bytes=$(wc -c < .runtime-state/kontur-runtime-state.tar.gz.gpg)
          test "$bytes" -gt 256 || { echo "Encrypted runtime object was not materialized from LFS"; exit 1; }
          echo "RUNTIME_LFS_OBJECT_PASS size=$bytes"

      - name: Decrypt runtime state to runner temp
        env:
          RUNTIME_STATE_KEY: ${{ secrets.RUNTIME_STATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNTIME_STATE_KEY" || { echo "RUNTIME_STATE_KEY is unavailable"; exit 1; }
          umask 077
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RUNTIME_STATE_KEY" \
            --output "$RUNNER_TEMP/kontur-runtime.tar.gz" \
            --decrypt .runtime-state/kontur-runtime-state.tar.gz.gpg
          gzip -t "$RUNNER_TEMP/kontur-runtime.tar.gz"
          mkdir -p "$RUNNER_TEMP/kontur-runtime"
          tar -xzf "$RUNNER_TEMP/kontur-runtime.tar.gz" -C "$RUNNER_TEMP/kontur-runtime"
          echo "RUNTIME_DECRYPT_PASS"

      - name: Discover Cloudflare credential names without exposing values
        shell: python
        run: |
          import json, os, re
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'kontur-runtime'
          wanted = {
              'CLOUDFLARE_API_TOKEN', 'CF_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID',
              'CF_ACCOUNT_ID', 'CLOUDFLARE_API_KEY', 'CLOUDFLARE_EMAIL'
          }
          found = {}

          def record(k, v, source):
              k = str(k).strip()
              if k not in wanted or k in found or v is None:
                  return
              v = str(v).strip().strip('"').strip("'")
              if v:
                  found[k] = (v, source)

          for p in root.rglob('*'):
              if not p.is_file() or p.stat().st_size > 2_000_000:
                  continue
              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              rel = str(p.relative_to(root))
              for line in text.splitlines():
                  m = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$', line)
                  if m:
                      record(m.group(1), m.group(2), rel)
              try:
                  obj = json.loads(text)
              except Exception:
                  obj = None
              def walk(x):
                  if isinstance(x, dict):
                      for k, v in x.items():
                          if isinstance(v, (str, int)):
                              record(k, v, rel)
                          walk(v)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v)
              if obj is not None:
                  walk(obj)

          token = found.get('CLOUDFLARE_API_TOKEN') or found.get('CF_API_TOKEN')
          account = found.get('CLOUDFLARE_ACCOUNT_ID') or found.get('CF_ACCOUNT_ID')
          print('CLOUDFLARE_TOKEN_PRESENT=' + ('true' if token else 'false'))
          print('CLOUDFLARE_ACCOUNT_ID_PRESENT=' + ('true' if account else 'false'))
          for k, (_, source) in sorted(found.items()):
              print(f'FOUND_NAME {k} source={source}')

          envfile = Path(os.environ['GITHUB_ENV'])
          if token:
              value = token[0]
              print(f'::add-mask::{value}')
              with envfile.open('a', encoding='utf-8') as f:
                  f.write('DISCOVERED_CLOUDFLARE_API_TOKEN<<__CF_TOKEN__\n')
                  f.write(value + '\n__CF_TOKEN__\n')
          if account:
              with envfile.open('a', encoding='utf-8') as f:
                  f.write(f'DISCOVERED_CLOUDFLARE_ACCOUNT_ID={account[0]}\n')

      - name: Verify preserved Cloudflare token read-only
        if: env.DISCOVERED_CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.DISCOVERED_CLOUDFLARE_API_TOKEN }}
          EXPLICIT_ACCOUNT_ID: ${{ env.DISCOVERED_CLOUDFLARE_ACCOUNT_ID }}
          PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify > "$RUNNER_TEMP/token-verify.json"
          node --input-type=module -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/token-verify.json','utf8')); if(!x.success) process.exit(1); console.log('CLOUDFLARE_TOKEN_VERIFY_PASS')"

          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/accounts?per_page=50' > "$RUNNER_TEMP/accounts.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/accounts.json', 'utf8'));
          if (!x.success || !Array.isArray(x.result) || x.result.length === 0) throw new Error('No accessible Cloudflare accounts');
          console.log(`CLOUDFLARE_ACCESSIBLE_ACCOUNTS=${x.result.length}`);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/account-ids.txt', x.result.map(a => a.id).join('\n') + '\n');
          NODE

          target=""
          if [ -n "${EXPLICIT_ACCOUNT_ID:-}" ]; then
            ids="$EXPLICIT_ACCOUNT_ID"
          else
            ids="$(cat "$RUNNER_TEMP/account-ids.txt")"
          fi
          while IFS= read -r account_id; do
            [ -n "$account_id" ] || continue
            code=$(curl -sS -o "$RUNNER_TEMP/d1-check.json" -w '%{http_code}' "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database/$PROD_D1_ID")
            if [ "$code" = "200" ]; then
              ok=$(node --input-type=module -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d1-check.json','utf8')); process.stdout.write(x.success?'yes':'no')")
              if [ "$ok" = "yes" ]; then
                if [ -n "$target" ] && [ "$target" != "$account_id" ]; then
                  echo "Production D1 resolved in more than one account"; exit 1
                fi
                target="$account_id"
              fi
            fi
          done <<< "$ids"
          test -n "$target" || { echo "Could not resolve account containing the known production D1"; exit 1; }
          echo "CLOUDFLARE_TARGET_ACCOUNT_ID=$target"
          echo "CLOUDFLARE_PRODUCTION_D1_READONLY_PROOF_PASS"

      - name: Cleanup decrypted runtime
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/kontur-runtime" "$RUNNER_TEMP/kontur-runtime.tar.gz" "$RUNNER_TEMP/token-verify.json" "$RUNNER_TEMP/accounts.json" "$RUNNER_TEMP/d1-check.json" "$RUNNER_TEMP/account-ids.txt"
