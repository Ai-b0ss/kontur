name: FREE FABRIC CircleCI Kontur Control

on:
  push:
    branches:
      - ci/kontur-circle-vite-20260821
    paths:
      - .github/workflows/free-fabric-circle-control.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  circle-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe both accounts, adopt-or-trigger Circle pipeline, and wait
        id: control
        continue-on-error: true
        env:
          CIRCLE_TOKEN_A: ${{ secrets.CIRCLE_TOKEN_A }}
          CIRCLE_TOKEN_B: ${{ secrets.CIRCLE_TOKEN_B }}
        run: |
          set +e
          python3 .free-fabric/circle_control_v2.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized result back to the control branch
        if: always()
        run: |
          set -euo pipefail
          test -f .free-fabric/runtime/circle-control-result.json
          git config user.name "FREE FABRIC bot"
          git config user.email "free-fabric@users.noreply.github.com"
          git add -- .free-fabric/runtime/circle-control-result.json
          if git diff --cached --quiet; then
            echo "No result delta to persist"
          else
            git commit -m "FREE FABRIC: persist sanitized Circle control result [skip ci]"
            git push origin HEAD:ci/kontur-circle-vite-20260821
          fi

      - name: Upload sanitized result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-fabric-circle-control-evidence
          path: .free-fabric/runtime/circle-control-result.json
          if-no-files-found: error

      - name: Final gate
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('.free-fabric/runtime/circle-control-result.json'))
          r=d.get('result') or {}
          print(json.dumps(d, ensure_ascii=False, indent=2))
          if r.get('status') != 'success':
              raise SystemExit(2)
          PY
