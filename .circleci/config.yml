version: 2.1

jobs:
  kontur-visual-regression-fix:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: medium
    environment:
      KONTUR_EXPECTED_SHA: c40f8a810fa432858591594be5d6a83b8c2f8fbe
      KONTUR_BROWSER_EVIDENCE_DIR: /tmp/kontur-visual-evidence/browser
    steps:
      - checkout

      - run:
          name: Checkout exact clean PR12 visual-fix head
          command: |
            set -euo pipefail
            git fetch origin fix/kontur-core-visual-continuity-20260818
            git checkout --detach "$KONTUR_EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$KONTUR_EXPECTED_SHA"
            test -z "$(git status --porcelain)"
            git diff --exit-code
            echo KONTUR_VISUAL_EXACT_HEAD_PASS

      - restore_cache:
          keys:
            - kontur-visual-v1-{{ checksum "pnpm-lock.yaml" }}
            - kontur-visual-v1-

      - run:
          name: Frozen install and exact source checks
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11.22.0 --activate
            pnpm install --frozen-lockfile | tee /tmp/install.log
            pnpm -F @kontur/miniapp test | tee /tmp/miniapp-tests.log
            pnpm -F @kontur/miniapp typecheck | tee /tmp/typecheck.log

      - save_cache:
          key: kontur-visual-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

      - run:
          name: Production build and served-dist smoke
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp build | tee /tmp/vite-build.log
            test -s apps/miniapp/dist/index.html
            (cd apps/miniapp/dist && python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dist-http.log 2>&1) &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html -o /tmp/dist-index.html && break; sleep 1; done
            test -s /tmp/dist-index.html
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            trap - EXIT
            echo KONTUR_VISUAL_PRODUCTION_DIST_PASS

      - run:
          name: Real Chromium visual regression acceptance
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp exec playwright install --with-deps chromium
            pnpm -F @kontur/miniapp test:browser:kontur 2>&1 | tee /tmp/browser-acceptance.log
            test -s "$KONTUR_BROWSER_EVIDENCE_DIR/browser-acceptance.json"
            node -e 'const f=require(process.env.KONTUR_BROWSER_EVIDENCE_DIR+"/browser-acceptance.json");if(f.result!=="PASS"||f.exactHead!==process.env.KONTUR_EXPECTED_SHA||f.consoleErrors.length)process.exit(1)'
            for f in \
              01-hook.png 12-large-hook.png 17-hook-390x844.png \
              15-hatch-intact.png 16-hatch-opening.png 06-bird-reveal.png 08-home.png \
              gallery-magpie-10-colorings.png gallery-magpie-real-plumage.png gallery-woodpecker-10-colorings.png \
              gallery-jay-10-colorings.png gallery-crane-10-colorings.png \
              gallery-owl-10-colorings.png gallery-kotosov-10-colorings.png \
              KONTUR_VISUAL_FIX_WALKTHROUGH.webm; do
              test -s "$KONTUR_BROWSER_EVIDENCE_DIR/$f"
            done
            ffmpeg_bin="$(command -v ffmpeg || find "$HOME/.cache/ms-playwright" -type f -name 'ffmpeg*' -perm -111 | head -1)"
            test -x "$ffmpeg_bin"
            "$ffmpeg_bin" -y \
              -i "$KONTUR_BROWSER_EVIDENCE_DIR/KONTUR_VISUAL_FIX_WALKTHROUGH.webm" \
              -vf 'scale=240:-2' -r 12 -an -c:v libvpx -crf 40 -b:v 180k \
              "$KONTUR_BROWSER_EVIDENCE_DIR/KONTUR_VISUAL_FIX_WALKTHROUGH_COMPRESSED.webm" \
              2>&1 | tee /tmp/ffmpeg.log
            test "${PIPESTATUS[0]}" = 0
            test -s "$KONTUR_BROWSER_EVIDENCE_DIR/KONTUR_VISUAL_FIX_WALKTHROUGH_COMPRESSED.webm"
            test "$(stat -c %s "$KONTUR_BROWSER_EVIDENCE_DIR/KONTUR_VISUAL_FIX_WALKTHROUGH_COMPRESSED.webm")" -lt 950000
            echo KONTUR_REAL_CHROMIUM_VISUAL_FIX_PASS

      - run:
          name: Collect visual evidence
          when: always
          command: |
            set -euo pipefail
            mkdir -p /tmp/kontur-visual-evidence/logs
            cp /tmp/install.log /tmp/kontur-visual-evidence/logs/ 2>/dev/null || true
            cp /tmp/miniapp-tests.log /tmp/kontur-visual-evidence/logs/ 2>/dev/null || true
            cp /tmp/typecheck.log /tmp/kontur-visual-evidence/logs/ 2>/dev/null || true
            cp /tmp/vite-build.log /tmp/kontur-visual-evidence/logs/ 2>/dev/null || true
            cp /tmp/browser-acceptance.log /tmp/kontur-visual-evidence/logs/ 2>/dev/null || true
            cp /tmp/ffmpeg.log /tmp/kontur-visual-evidence/logs/ 2>/dev/null || true
            printf 'head=%s\ncircle_trigger=%s\nclean=true\npatch_overlay=false\nproduction_touched=false\nstaging_touched=false\n' "$KONTUR_EXPECTED_SHA" "$CIRCLE_SHA1" > /tmp/kontur-visual-evidence/CIRCLE_EVIDENCE.txt

      - run:
          name: Publish immutable visual evidence branch
          when: always
          command: |
            set -euo pipefail
            evidence_branch="evidence/kontur-emergency-c40f8a81-20260822"
            target="docs/product/evidence/runtime/c40f8a81-emergency-visual"
            git switch --create "$evidence_branch" "$KONTUR_EXPECTED_SHA"
            mkdir -p "$target/browser" "$target/logs"
            cp "$KONTUR_BROWSER_EVIDENCE_DIR"/*.png "$target/browser/" 2>/dev/null || true
            cp "$KONTUR_BROWSER_EVIDENCE_DIR"/*.webm "$target/browser/" 2>/dev/null || true
            cp "$KONTUR_BROWSER_EVIDENCE_DIR"/browser-acceptance.json "$target/browser/" 2>/dev/null || true
            cp /tmp/kontur-visual-evidence/logs/* "$target/logs/" 2>/dev/null || true
            cp /tmp/kontur-visual-evidence/CIRCLE_EVIDENCE.txt "$target/"
            find "$target" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$target/SHA256SUMS.txt"
            git config user.name "Kontur Acceptance Bot"
            git config user.email "kontur-acceptance@users.noreply.github.com"
            git add "$target"
            git commit -m "evidence: preserve c40f8a81 emergency visual fix"
            git push origin "HEAD:refs/heads/$evidence_branch"
            echo "KONTUR_VISUAL_EVIDENCE_BRANCH_PASS branch=$evidence_branch"

      - store_artifacts:
          path: /tmp/kontur-visual-evidence
          destination: kontur-visual-regression-fix

workflows:
  kontur-visual-regression-fix:
    jobs:
      - kontur-visual-regression-fix:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
