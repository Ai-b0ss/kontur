name: Kontur Cloudflare staging bootstrap

on:
  push:
    branches:
      - infra/cloudflare-runtime-discovery

permissions:
  contents: read

concurrency:
  group: kontur-cloudflare-staging-bootstrap
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 7a5b709a066fca0ee563c42b3e5c4f10
  PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985
  PROD_D1_NAME: kontur
  PROD_WORKER_NAME: kontur-igor
  STAGING_D1_NAME: kontur-staging
  STAGING_WORKER_NAME: kontur-igor-staging
  STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev

jobs:
  bootstrap:
    name: verify + create isolated staging + deploy + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Require token without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          echo 'CLOUDFLARE_API_TOKEN_PRESENT'

      - name: Offline staging isolation gate
        run: node tools/cloudflare/staging-config-check.mjs

      - name: Full project verification before Cloudflare writes
        run: pnpm check
        timeout-minutes: 15

      - name: Build Mini App assets
        run: pnpm build
        timeout-minutes: 5

      - name: Verify token and production identity read-only
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify > "$RUNNER_TEMP/token.json"
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/token.json','utf8')); if(!x.success||x.result?.status!=='active') throw new Error('Cloudflare token is not active'); console.log('CLOUDFLARE_TOKEN_VERIFY_PASS')"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_D1_ID" > "$RUNNER_TEMP/prod-d1.json"
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/prod-d1.json','utf8')); if(!x.success) throw new Error('Known production D1 is not readable'); if(x.result?.uuid!==process.env.PROD_D1_ID) throw new Error('Production D1 UUID mismatch'); if(x.result?.name!==process.env.PROD_D1_NAME) throw new Error('Production D1 name mismatch'); console.log('PRODUCTION_D1_IDENTITY_READONLY_PASS')"

      - name: Resolve or create staging D1 only
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" > "$RUNNER_TEMP/d1-list.json"

          existing_id=$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d1-list.json','utf8')); if(!x.success||!Array.isArray(x.result)) throw new Error('Cannot list D1 databases'); const s=x.result.filter(d=>d.name===process.env.STAGING_D1_NAME); if(s.length>1) throw new Error('More than one staging D1 with expected name'); if(s.length===1){ const id=s[0].uuid; if(!id||id===process.env.PROD_D1_ID) throw new Error('Staging D1 resolved to production UUID'); process.stdout.write(id); }")

          if [ -n "$existing_id" ]; then
            staging_id="$existing_id"
            created=false
            echo 'STAGING_D1_EXISTING_PASS'
          else
            curl -fsS -X POST "${auth[@]}" \
              --data "{\"name\":\"$STAGING_D1_NAME\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" > "$RUNNER_TEMP/d1-create.json"
            staging_id=$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d1-create.json','utf8')); if(!x.success) throw new Error('Staging D1 create failed'); const id=x.result?.uuid; if(!id||id===process.env.PROD_D1_ID) throw new Error('Created D1 UUID is invalid or production'); if(x.result?.name!==process.env.STAGING_D1_NAME) throw new Error('Created D1 name mismatch'); process.stdout.write(id);")
            created=true
            echo 'STAGING_D1_CREATE_PASS'
          fi

          test -n "$staging_id"
          test "$staging_id" != "$PROD_D1_ID"
          echo "CLOUDFLARE_STAGING_D1_DATABASE_ID=$staging_id" >> "$GITHUB_ENV"
          echo "STAGING_D1_CREATED=$created" >> "$GITHUB_ENV"

      - name: Generate isolated staging config
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: ${{ env.STAGING_WORKER_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ env.STAGING_D1_NAME }}
        run: node tools/cloudflare/make-staging-config.mjs

      - name: Verify generated config cannot point at production
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import fs from 'node:fs'; const text=fs.readFileSync('apps/worker/wrangler.staging.generated.jsonc','utf8'); if(text.includes(process.env.PROD_D1_ID)) throw new Error('Generated staging config contains production D1 UUID'); if(!text.includes(process.env.CLOUDFLARE_STAGING_D1_DATABASE_ID)) throw new Error('Generated staging config lacks resolved staging D1 UUID'); if(!text.includes(process.env.STAGING_WORKER_NAME)) throw new Error('Generated staging config lacks staging Worker name'); console.log('GENERATED_STAGING_CONFIG_FAIL_CLOSED_PASS')"

      - name: Wrangler staging dry-run
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc --dry-run

      - name: Apply migrations to staging D1 only
        run: pnpm -F @kontur/worker exec wrangler d1 migrations apply "$STAGING_D1_NAME" --remote --config wrangler.staging.generated.jsonc
        timeout-minutes: 5

      - name: Deploy staging Worker only
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc
        timeout-minutes: 8

      - name: Live smoke on staging only
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code=$(curl -sS -o "$RUNNER_TEMP/root.html" -w '%{http_code}' "$STAGING_ORIGIN/" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          test "$code" = "200" || { echo "Staging root did not become healthy: HTTP $code"; exit 1; }
          grep -q '<div id="root">' "$RUNNER_TEMP/root.html" || { echo 'Mini App root marker missing'; exit 1; }

          health_code=$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$STAGING_ORIGIN/api/health" || true)
          test "$health_code" = "200" || { echo "Staging /api/health failed: HTTP $health_code"; cat "$RUNNER_TEMP/health.json"; exit 1; }
          echo 'STAGING_LIVE_SMOKE_PASS'

      - name: Report safe staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_STAGING_D1_DATABASE_ID" != "$PROD_D1_ID"
          echo "STAGING_WORKER=$STAGING_WORKER_NAME"
          echo "STAGING_D1=$STAGING_D1_NAME"
          echo "STAGING_D1_ID=$CLOUDFLARE_STAGING_D1_DATABASE_ID"
          echo "STAGING_D1_CREATED=$STAGING_D1_CREATED"
          echo "STAGING_URL=$STAGING_ORIGIN"
          echo 'PRODUCTION_TARGETS_UNTOUCHED_BY_COMMAND_SET=true'

      - name: Cleanup transient files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/token.json" "$RUNNER_TEMP/prod-d1.json" "$RUNNER_TEMP/d1-list.json" "$RUNNER_TEMP/d1-create.json" "$RUNNER_TEMP/root.html" "$RUNNER_TEMP/health.json"
