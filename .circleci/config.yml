version: 2.1

jobs:
  circle-env-smoke:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: medium
    steps:
      - run:
          name: Minimal executor smoke
          command: |
            set -euo pipefail
            node --version
            echo CIRCLE_EXECUTOR_SMOKE_PASS

workflows:
  circle-env-smoke:
    jobs:
      - circle-env-smoke:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
