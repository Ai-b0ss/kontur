name: Kontur CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kontur-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: remote verification
    runs-on: [self-hosted, local-pc]
    # Self-hosted runner on the owner's PC: never run PR code from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm --version

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Cloudflare staging isolation gate
        timeout-minutes: 1
        run: node tools/cloudflare/staging-config-check.mjs

      - name: Core unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/core test

      - name: DB unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/db test

      - name: Bot unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/bot test

      - name: Mini App unit tests
        timeout-minutes: 2
        run: pnpm -F @kontur/miniapp test

      - name: Worker full local test gate
        timeout-minutes: 8
        run: pnpm cf:test

      - name: API integration check
        timeout-minutes: 3
        run: pnpm test:api

      - name: TypeScript typecheck
        timeout-minutes: 5
        run: pnpm typecheck

      - name: Economy simulation
        timeout-minutes: 2
        run: pnpm sim

      - name: D1 transfer check
        timeout-minutes: 3
        run: pnpm cf:test-transfer

      - name: Mini App production build
        timeout-minutes: 5
        run: pnpm build

      - name: Generate isolated staging config for Wrangler dry-run
        timeout-minutes: 1
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: kontur-igor-staging
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: kontur-staging
          CLOUDFLARE_STAGING_D1_DATABASE_ID: 00000000-0000-4000-8000-000000000001
          STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev
        run: node tools/cloudflare/make-staging-config.mjs

      - name: Cloudflare staging Wrangler dry-run
        timeout-minutes: 2
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc --dry-run
