name: TEMP disable Free Fabric cron

on:
  push:
    branches:
      - ops/disable-free-fabric-cron-20260926
    paths:
      - .github/workflows/temp-disable-free-fabric-cron.yml

permissions:
  contents: read

concurrency:
  group: temp-disable-free-fabric-cron
  cancel-in-progress: false

jobs:
  disable-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SCRIPT_NAME: free-fabric-control-staging

    steps:
      - name: Verify credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }

      - name: Read current cron triggers
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/schedules"
          curl --fail-with-body --silent --show-error "$url"             -H "Authorization: Bearer $CF_API_TOKEN"             > "$RUNNER_TEMP/before.json"
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.RUNNER_TEMP + '/before.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!j.success) throw new Error('Cloudflare GET schedules failed');
          const crons = (j.result?.schedules ?? []).map(x => x.cron);
          console.log('BEFORE_CRONS=' + JSON.stringify(crons));
          NODE

      - name: Disable all cron triggers on Free Fabric staging
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/schedules"
          curl --fail-with-body --silent --show-error             -X PUT "$url"             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json"             --data '[]'             > "$RUNNER_TEMP/update.json"
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.RUNNER_TEMP + '/update.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!j.success) throw new Error('Cloudflare PUT schedules failed');
          const crons = j.result?.schedules ?? [];
          if (crons.length !== 0) throw new Error('Cloudflare still reports schedules after update');
          console.log('UPDATE_CRONS=[]');
          NODE

      - name: Verify cron triggers are gone
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/schedules"
          curl --fail-with-body --silent --show-error "$url"             -H "Authorization: Bearer $CF_API_TOKEN"             > "$RUNNER_TEMP/after.json"
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.RUNNER_TEMP + '/after.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!j.success) throw new Error('Cloudflare verification GET failed');
          const crons = j.result?.schedules ?? [];
          if (crons.length !== 0) throw new Error('Cron trigger removal did not persist');
          console.log('FREE_FABRIC_CRON_DISABLED');
          NODE
