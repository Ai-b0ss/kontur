version: 2.1

# TEMPLATE ONLY. Do not run from the control repo.
# Final use: move Ai-b0ss/qwen-free-api:ci/qwen-final-gate to the chosen exact
# product SHA, then add this file as .circleci/config.yml in ONE gate-only commit.
# HEAD^ must therefore be the exact product SHA; HEAD may differ only by this config.

orbs:
  win: circleci/windows@5.0

commands:
  verify_gate_commit_linux:
    steps:
      - run:
          name: Verify gate commit overlays config only
          command: |
            set -euo pipefail
            product_sha="$(git rev-parse HEAD^)"
            changed="$(git diff --name-only HEAD^ HEAD)"
            test "$changed" = ".circleci/config.yml"
            echo "QWEN_PRODUCT_SHA=$product_sha"
            echo "QWEN_GATE_SHA=$(git rev-parse HEAD)"

jobs:
  qwen-linux-final:
    docker:
      - image: node:22.23.1-bookworm
    resource_class: medium
    steps:
      - checkout
      - verify_gate_commit_linux
      - restore_cache:
          keys:
            - qwen-node-v2-{{ checksum "package-lock.json" }}
      - run:
          name: Install exact locked dependencies
          command: npm ci --ignore-scripts --no-audit --no-fund
      - save_cache:
          key: qwen-node-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run complete offline Qwen suite on Linux
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p /tmp/qwen-linux-evidence
            npm test 2>&1 | tee /tmp/qwen-linux-evidence/npm-test.log
      - store_artifacts:
          path: /tmp/qwen-linux-evidence
          destination: qwen-linux-final

  qwen-windows-final:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Verify gate commit overlays config only
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $productSha = (git rev-parse HEAD^).Trim()
            $changed = @((git diff --name-only HEAD^ HEAD) | Where-Object { $_ -ne '' })
            if ($changed.Count -ne 1 -or $changed[0] -ne '.circleci/config.yml') { throw 'QWEN_GATE_OVERLAY_INVALID' }
            Write-Host "QWEN_PRODUCT_SHA=$productSha"
            Write-Host "QWEN_GATE_SHA=$((git rev-parse HEAD).Trim())"
      - run:
          name: Install exact Node 22.23.1 locally
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $root = Join-Path (Get-Location).Path '.circleci-node'
            $zip = Join-Path $env:TEMP 'node-v22.23.1-win-x64.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://nodejs.org/dist/v22.23.1/node-v22.23.1-win-x64.zip' -OutFile $zip
            if (Test-Path $root) { Remove-Item -LiteralPath $root -Recurse -Force }
            Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
            $nodeRoot = Join-Path $root 'node-v22.23.1-win-x64'
            $node = Join-Path $nodeRoot 'node.exe'
            $npm = Join-Path $nodeRoot 'npm.cmd'
            if (-not (Test-Path $node) -or -not (Test-Path $npm)) { throw 'QWEN_WINDOWS_NODE_INSTALL_FAILED' }
            & $node --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $npm --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "QWEN_NODE_ROOT=$nodeRoot" | Out-File -FilePath $env:BASH_ENV -Append -Encoding ascii
      - run:
          name: Locked install and complete offline Qwen suite on native Windows
          no_output_timeout: 60m
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $nodeRoot = Join-Path (Get-Location).Path '.circleci-node\node-v22.23.1-win-x64'
            $npm = Join-Path $nodeRoot 'npm.cmd'
            $env:Path = "$nodeRoot;$env:Path"
            $evidence = Join-Path $env:TEMP 'qwen-windows-evidence'
            New-Item -ItemType Directory -Force -Path $evidence | Out-Null
            & $npm ci --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'npm-ci.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $npm test 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'npm-test.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host 'QWEN_NATIVE_WINDOWS_FULL_SUITE_PASS'
      - store_artifacts:
          path: C:\Users\circleci\AppData\Local\Temp\qwen-windows-evidence
          destination: qwen-windows-final
      - run:
          name: Cleanup local Node
          when: always
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Remove-Item -LiteralPath (Join-Path (Get-Location).Path '.circleci-node') -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $env:TEMP 'node-v22.23.1-win-x64.zip') -Force -ErrorAction SilentlyContinue

workflows:
  qwen-final-linux-and-windows:
    jobs:
      - qwen-linux-final:
          filters:
            branches:
              only: ci/qwen-final-gate
      - qwen-windows-final:
          filters:
            branches:
              only: ci/qwen-final-gate
