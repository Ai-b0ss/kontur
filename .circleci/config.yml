version: 2.1

jobs:
  kontur-source-proof:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: medium
    environment:
      KONTUR_CANDIDATE_SHA: 7c36a31d127166c0c08bcc0b7d9e87b3235286a6
    steps:
      - checkout
      - run:
          name: Verify exact candidate source checks
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            git fetch origin fix/kontur-hatch-master-frame-20260823
            git checkout --detach "$KONTUR_CANDIDATE_SHA"
            test "$(git rev-parse HEAD)" = "$KONTUR_CANDIDATE_SHA"
            corepack enable
            corepack prepare pnpm@11.22.0 --activate
            pnpm install --frozen-lockfile
            pnpm -F @kontur/miniapp test
            pnpm -F @kontur/miniapp typecheck
            pnpm -F @kontur/miniapp build
            echo "KONTUR_SOURCE_PROOF_PASS candidate=$KONTUR_CANDIDATE_SHA"

workflows:
  kontur-source-proof:
    jobs:
      - kontur-source-proof:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
