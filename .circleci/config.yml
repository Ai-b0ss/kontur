version: 2.1

jobs:
  kontur-hatch-master-frame-proof:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: medium
    environment:
      KONTUR_CANDIDATE_SHA: fa5c0f7047eac3380bc8bcb77c05b3cd6fe00de5
    steps:
      - checkout
      - run:
          name: Checkout exact candidate
          command: |
            set -euo pipefail
            git fetch origin fix/kontur-hatch-master-frame-20260823
            git checkout --detach "$KONTUR_CANDIDATE_SHA"
            test "$(git rev-parse HEAD)" = "$KONTUR_CANDIDATE_SHA"
            echo "KONTUR_EXACT_CANDIDATE_PASS=$KONTUR_CANDIDATE_SHA"
      - run:
          name: Install
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11.22.0 --activate
            pnpm install --frozen-lockfile
      - run:
          name: Mini App tests
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp test
      - run:
          name: Mini App typecheck
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp typecheck
      - run:
          name: Production build
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp build
      - run:
          name: Install Chromium
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            pnpm exec playwright install chromium
      - run:
          name: Real Chromium hatch proof
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            node apps/miniapp/test/telegram-hatch-browser.mjs
      - store_artifacts:
          path: apps/miniapp/dist/telegram-hatch-evidence
          destination: telegram-hatch-evidence

workflows:
  kontur-hatch-master-frame-proof:
    jobs:
      - kontur-hatch-master-frame-proof:
          filters:
            branches:
              only: ci/circle-account-smoke-20260823
