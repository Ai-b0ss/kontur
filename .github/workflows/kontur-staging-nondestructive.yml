name: Kontur non-destructive staging proof

on:
  push:
    branches:
      - fix/kontur-core-visual-continuity-20260818

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 7a5b709a066fca0ee563c42b3e5c4f10
  STAGING_WORKER_NAME: kontur-igor-staging
  STAGING_D1_NAME: kontur-staging
  STAGING_D1_ID: 22786b4b-99cc-4ca5-a18b-932e8781021b
  STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev
  PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985

jobs:
  staging-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Install exact dependencies and build current Mini App
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @kontur/miniapp test
          pnpm -F @kontur/miniapp build
      - name: Generate isolated staging config
        env:
          CLOUDFLARE_STAGING_WORKER_NAME: ${{ env.STAGING_WORKER_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ env.STAGING_D1_NAME }}
          CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ env.STAGING_D1_ID }}
          CLOUDFLARE_STAGING_ORIGIN: ${{ env.STAGING_ORIGIN }}
        run: node tools/cloudflare/make-staging-config.mjs
      - name: Prove staging identity without DB mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_D1_ID" != "$PROD_D1_ID"
          pnpm -F @kontur/worker exec wrangler d1 info "$STAGING_D1_NAME" --json > "$RUNNER_TEMP/staging-d1.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync(process.env.RUNNER_TEMP+'/staging-d1.json','utf8');
          if(!text.includes(process.env.STAGING_D1_NAME)||!text.includes(process.env.STAGING_D1_ID)) throw new Error('staging D1 identity mismatch');
          if(text.includes(process.env.PROD_D1_ID)) throw new Error('production D1 leaked into staging identity');
          console.log('STAGING_IDENTITY_READONLY_PASS');
          NODE
      - name: Deploy Worker and assets to isolated staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc --keep-vars
      - name: Wait for exact deployed frontend generation
        env:
          RELEASE_ORIGIN: ${{ env.STAGING_ORIGIN }}
          RELEASE_PROPAGATION_TIMEOUT_MS: '180000'
        run: node tools/cloudflare/wait-for-deployed-assets.mjs
      - name: Verify canonical character assets and API boundary remotely
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$STAGING_ORIGIN/results/kotosov.webp" -o "$RUNNER_TEMP/kotosov.webp"
          curl -fsS "$STAGING_ORIGIN/results/crane-collectible.svg" -o "$RUNNER_TEMP/crane.svg"
          test "$(sha256sum apps/miniapp/public/results/kotosov.webp | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/kotosov.webp" | awk '{print $1}')"
          test "$(sha256sum apps/miniapp/public/results/crane-collectible.svg | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/crane.svg" | awk '{print $1}')"
          grep -q '<svg' "$RUNNER_TEMP/crane.svg"
          code="$(curl -sS -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' "$STAGING_ORIGIN/api/v4/local/state")"
          test "$code" = "401"
          echo "KONTUR_STAGING_NONDESTRUCTIVE_PASS head=$GITHUB_SHA origin=$STAGING_ORIGIN d1=$STAGING_D1_ID production_d1_untouched=$PROD_D1_ID"
      - name: Verify current MVP economy and persistence on synthetic staging identity
        shell: bash
        run: |
          set -euo pipefail
          STAGING_TG_ID="$((700000000 + GITHUB_RUN_NUMBER))" node tools/cloudflare/live-release-staging-smoke.mjs
