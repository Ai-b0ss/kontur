version: 2.1

jobs:
  kontur-browser-proof:
    docker:
      - image: cimg/node:22.18-browsers
    resource_class: medium
    environment:
      KONTUR_EXPECTED_SHA: b00a2d3262f80e3a44fa2798e25b750d6fa7c737
      KONTUR_TELEGRAM_EVIDENCE_DIR: /tmp/kontur-telegram-hatch-evidence
    steps:
      - checkout
      - run:
          name: Exact candidate
          command: |
            set -euo pipefail
            git fetch origin fix/kontur-hatch-shells-telegram-viewport-20260822
            git checkout --detach "$KONTUR_EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$KONTUR_EXPECTED_SHA"
            test -z "$(git status --porcelain)"
            echo KONTUR_CIRCLE_EXACT_HEAD_PASS
      - run:
          name: Install and build
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11.22.0 --activate
            pnpm install --frozen-lockfile
            pnpm -F @kontur/miniapp build
            test -s apps/miniapp/dist/index.html
      - run:
          name: Real Chromium Telegram hatch proof
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            pnpm -F @kontur/miniapp exec playwright install --with-deps chromium
            mkdir -p "$KONTUR_TELEGRAM_EVIDENCE_DIR"
            pnpm --dir apps/miniapp exec node test/telegram-hatch-browser.mjs 2>&1 | tee /tmp/telegram-hatch-browser.log
            grep -q 'KONTUR_TELEGRAM_HATCH_BROWSER_PASS' /tmp/telegram-hatch-browser.log
            test -s "$KONTUR_TELEGRAM_EVIDENCE_DIR/telegram-390x760-normal.png"
            test -s "$KONTUR_TELEGRAM_EVIDENCE_DIR/telegram-390x760-reduced.png"
            echo KONTUR_CIRCLE_REAL_CHROMIUM_PASS

workflows:
  kontur-browser-proof:
    jobs:
      - kontur-browser-proof:
          filters:
            branches:
              only: ci/kontur-circle-vite-20260821
