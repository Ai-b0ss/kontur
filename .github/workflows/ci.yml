name: Kontur CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - ci/remote-agent-foundation

permissions:
  contents: read

concurrency:
  group: kontur-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full project check
        run: pnpm check
