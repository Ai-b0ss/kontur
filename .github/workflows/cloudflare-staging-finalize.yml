name: Kontur Cloudflare staging finalizer

on:
  push:
    branches:
      - infra/cloudflare-runtime-discovery

permissions:
  contents: read

concurrency:
  group: kontur-cloudflare-staging-finalizer
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 7a5b709a066fca0ee563c42b3e5c4f10
  CLOUDFLARE_STAGING_D1_DATABASE_ID: 22786b4b-99cc-4ca5-a18b-932e8781021b
  CLOUDFLARE_STAGING_D1_DATABASE_NAME: kontur-staging
  CLOUDFLARE_STAGING_WORKER_NAME: kontur-igor-staging
  STAGING_ORIGIN: https://kontur-igor-staging.igorekglukhovskii43.workers.dev
  PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Staging isolation gate
        run: node tools/cloudflare/staging-config-check.mjs
      - name: Build
        run: pnpm build
      - name: Generate exact staging config
        run: node tools/cloudflare/make-staging-config.mjs
      - name: Fail closed before remote write
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_STAGING_D1_DATABASE_ID" != "$PROD_D1_ID"
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('apps/worker/wrangler.staging.generated.jsonc','utf8')); if(c.name!=='kontur-igor-staging') throw new Error('wrong Worker'); const d=c.d1_databases.find(x=>x.binding==='DB'); if(d.database_id!==process.env.CLOUDFLARE_STAGING_D1_DATABASE_ID) throw new Error('wrong D1'); if(c.vars.DEV_MODE!=='false'||c.vars.LIVE_CAMPAIGN_V5_ENABLED!=='false'||c.vars.LIVE_CAMPAIGN_V5_PUBLISH_ENABLED!=='false') throw new Error('unsafe staging gates'); console.log('FINALIZER_FAIL_CLOSED_PASS')"
      - name: Dry run
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc --dry-run
      - name: Deploy staging only
        run: pnpm -F @kontur/worker exec wrangler deploy --config wrangler.staging.generated.jsonc
      - name: Live staging smoke
        shell: bash
        run: |
          set -euo pipefail
          root_code=$(curl -sS -o "$RUNNER_TEMP/root.html" -w '%{http_code}' "$STAGING_ORIGIN/")
          test "$root_code" = 200
          grep -q '<div id="root">' "$RUNNER_TEMP/root.html"
          health_code=$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$STAGING_ORIGIN/api/v1/health")
          test "$health_code" = 200 || { cat "$RUNNER_TEMP/health.json"; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health.json','utf8')); if(x.ok!==true||x.devMode!==false||x.driver!=='d1') throw new Error('bad staging health'); console.log(JSON.stringify({ok:x.ok,devMode:x.devMode,driver:x.driver,startedBot:x.startedBot,hatched:x.hatched,grants:x.grants}));"
          echo 'STAGING_FINAL_LIVE_SMOKE_PASS'
