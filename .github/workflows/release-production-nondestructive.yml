name: Kontur non-destructive production hatch release

on:
  push:
    branches:
      - cursor/hatch-visual-acceptance-1021
    paths:
      - .release-trigger/production-nondestructive.txt

permissions:
  contents: read

concurrency:
  group: kontur-production-release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 7a5b709a066fca0ee563c42b3e5c4f10
  PROD_WORKER_NAME: kontur-igor
  PROD_D1_NAME: kontur
  PROD_D1_ID: 91e39e7e-70fc-4551-8d3e-48235e70f985
  STAGING_D1_ID: 22786b4b-99cc-4ca5-a18b-932e8781021b
  PROD_ORIGIN: https://kontur-igor.igorekglukhovskii43.workers.dev

jobs:
  deploy-production-without-d1-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Install, Mini App tests, typecheck and production build
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @kontur/miniapp test
          pnpm typecheck
          pnpm build

      - name: Require Cloudflare credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Generate fail-closed production config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src = 'apps/worker/wrangler.jsonc';
          const out = 'apps/worker/wrangler.production.generated.jsonc';
          const config = JSON.parse(fs.readFileSync(src, 'utf8').replace(/^\uFEFF/, ''));
          if (config.name !== process.env.PROD_WORKER_NAME) throw new Error('production Worker identity mismatch');
          const db = (config.d1_databases || []).find((item) => item?.binding === 'DB');
          if (!db || db.database_name !== process.env.PROD_D1_NAME || db.database_id !== process.env.PROD_D1_ID) {
            throw new Error('production D1 binding mismatch');
          }
          if (db.database_id === process.env.STAGING_D1_ID) throw new Error('staging D1 leaked into production config');
          if (config.assets?.directory !== '../miniapp/dist') throw new Error('unexpected production assets directory');
          fs.writeFileSync(out, `${JSON.stringify(config, null, 2)}\n`);
          console.log('NONDESTRUCTIVE_PRODUCTION_CONFIG_PASS');
          NODE

      - name: Verify production identity and required secret names read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        working-directory: apps/worker
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 info "$PROD_D1_NAME" --config wrangler.production.generated.jsonc --json > "$RUNNER_TEMP/prod-d1-info.json"
          pnpm exec wrangler secret list --config wrangler.production.generated.jsonc --json > "$RUNNER_TEMP/prod-secret-names.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d1 = fs.readFileSync(process.env.RUNNER_TEMP + '/prod-d1-info.json', 'utf8');
          if (!d1.includes(process.env.PROD_D1_NAME) || !d1.includes(process.env.PROD_D1_ID)) {
            throw new Error('production D1 identity mismatch');
          }
          if (d1.includes(process.env.STAGING_D1_ID)) throw new Error('staging D1 appeared in production identity');
          const names = new Set(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/prod-secret-names.json', 'utf8')).map((item) => item.name));
          for (const required of ['BOT_TOKEN', 'JWT_SECRET', 'WEBHOOK_SECRET', 'ADMIN_SECRET']) {
            if (!names.has(required)) throw new Error(`required production secret missing: ${required}`);
          }
          console.log('PRODUCTION_IDENTITY_AND_SECRET_NAMES_PASS');
          NODE

      - name: Capture pre-deploy user counts read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/worker
        run: |
          pnpm exec wrangler d1 execute "$PROD_D1_NAME" --remote --config wrangler.production.generated.jsonc --json --command \
            "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM profiles WHERE hatched_at IS NOT NULL) AS hatched" \
            > "$RUNNER_TEMP/pre-deploy-counts.json"

      - name: Deploy accepted Mini App and Worker without migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --keep-vars --config wrangler.production.generated.jsonc

      - name: Wait for exact production frontend generation
        env:
          RELEASE_ORIGIN: ${{ env.PROD_ORIGIN }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}
          RELEASE_EVIDENCE_PREFIX: prod-hatch
          RELEASE_PROPAGATION_TIMEOUT_MS: '180000'
        run: node tools/cloudflare/wait-for-deployed-assets.mjs

      - name: Verify health, API boundary, webhook and preserved data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$PROD_ORIGIN/api/v1/health?kontur_release_probe=$GITHUB_SHA" > "$RUNNER_TEMP/prod-health.json"
          code="$(curl -sS -o "$RUNNER_TEMP/prod-unauth.json" -w '%{http_code}' \
            "$PROD_ORIGIN/api/v4/local/state?kontur_release_probe=$GITHUB_SHA")"
          test "$code" = "401"
          webhook="$(curl -sS -o "$RUNNER_TEMP/prod-webhook.json" -w '%{http_code}' \
            -X POST "$PROD_ORIGIN/telegram/webhook")"
          test "$webhook" = "403"
          (
            cd apps/worker
            pnpm exec wrangler d1 execute "$PROD_D1_NAME" --remote --config wrangler.production.generated.jsonc --json --command \
              "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM profiles WHERE hatched_at IS NOT NULL) AS hatched" \
              > "$RUNNER_TEMP/post-deploy-counts.json"
          )
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/prod-health.json', 'utf8'));
          if (health.ok !== true || health.devMode !== false || health.driver !== 'd1') {
            throw new Error('production health mismatch');
          }
          const firstRecord = (value) => {
            const records = [];
            const visit = (item) => {
              if (Array.isArray(item)) item.forEach(visit);
              else if (item && typeof item === 'object') {
                if (Number.isInteger(item.users) && Number.isInteger(item.hatched)) records.push(item);
                Object.values(item).forEach(visit);
              }
            };
            visit(value);
            if (!records[0]) throw new Error('D1 count result missing');
            return records[0];
          };
          const pre = firstRecord(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pre-deploy-counts.json', 'utf8')));
          const post = firstRecord(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/post-deploy-counts.json', 'utf8')));
          if (post.users < pre.users || post.hatched < pre.hatched) throw new Error('production user data count decreased');
          console.log(`NONDESTRUCTIVE_PRODUCTION_SMOKE_PASS users=${post.users} hatched=${post.hatched} health=${JSON.stringify(health)}`);
          NODE

      - name: Upload release diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kontur-production-hatch-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/prod-health.json
            ${{ runner.temp }}/prod-unauth.json
            ${{ runner.temp }}/prod-webhook.json
            ${{ runner.temp }}/pre-deploy-counts.json
            ${{ runner.temp }}/post-deploy-counts.json
            ${{ runner.temp }}/prod-d1-info.json
            ${{ runner.temp }}/prod-secret-names.json
            ${{ runner.temp }}/prod-hatch-root.html
            ${{ runner.temp }}/prod-hatch-egg01.webp
            ${{ runner.temp }}/prod-hatch-egg08.webp
